<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#181818">

  <title>Gemini Mobile Studio</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Fixed Importmap JSON syntax -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
  
<body>

  <header>
    <h1>Gemini</h1>
    <div class="header-controls">
      <select id="model-select" class="model-select">
        <option value="gemini-3.8-flash">3.8 Flash</option>
        <option value="gemini-3.5-flash-lite">3.5 Flash Lite</option>
        <option value="gemini-2.5-flash">2.5 Flash</option>
        <option value="gemini-2.5-pro">2.5 Pro</option>
      </select>
      <button id="clear-chat-btn">Clear</button>
      <button id="clear-key-btn">Key</button>
    </div>
    <!-- Inside your header bar -->
<div class="header-left">
  <button id="menu-btn" class="icon-btn">☰</button>
  <span class="app-title">Gemini</span>
</div>

<!-- Add Sidebar Overlay and Drawer right below header -->
<div id="sidebar-overlay" class="overlay"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h3>Chat History</h3>
    <button id="new-chat-btn" class="primary-btn">+ New Chat</button>
  </div>
  <div id="history-list" class="history-list">
    <!-- Saved sessions will be dynamically rendered here -->
  </div>
</aside>
    
  </header>

  <div id="chat-box"></div>

  <div id="file-preview-bar">
    <span id="file-name-display"></span>
    <button id="remove-file-btn">✕</button>
  </div>

  <div id="input-area">
    <label class="file-upload-label" for="file-input" title="Attach file">📎</label>
    <input type="file" id="file-input" multiple style="display:none;" />

    <input type="text" id="user-input" placeholder="Type a message...">
    <button id="send-btn" class="send-btn">Send</button>
  </div>

  <div id="key-modal">
    <div class="modal-content">
      <h3>Enter AI Studio API Key</h3>
      <p style="font-size: 0.85rem; color: #aaa;">Saved locally in browser storage.</p>
      <input type="password" id="api-key-input" placeholder="AIzaSy...">
      <button id="save-key-btn">Save Key</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
